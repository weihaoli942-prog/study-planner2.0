<!DOCTYPE html>
<html>

<head>
    <title>Smart Study Planner</title>
</head>

<body>

<h1>Smart Study Planner</h1>

<form method="POST">

    <h2>Subject 1</h2>

    <input
        type="text"
        name="name1"
        placeholder="Subject Name"
        required>

    <br><br>

    <input
        type="number"
        name="difficulty1"
        placeholder="Difficulty (1-5)"
        required>

    <br><br>

    <input
        type="number"
        name="days1"
        placeholder="Days Until Exam"
        required>

    <hr>

    <h2>Subject 2</h2>

    <input
        type="text"
        name="name2"
        placeholder="Subject Name"
        required>

    <br><br>

    <input
        type="number"
        name="difficulty2"
        placeholder="Difficulty (1-5)"
        required>

    <br><br>

    <input
        type="number"
        name="days2"
        placeholder="Days Until Exam"
        required>

    <hr>

    <h2>Subject 3</h2>

    <input
        type="text"
        name="name3"
        placeholder="Subject Name"
        required>

    <br><br>

    <input
        type="number"
        name="difficulty3"
        placeholder="Difficulty (1-5)"
        required>

    <br><br>

    <input
        type="number"
        name="days3"
        placeholder="Days Until Exam"
        required>

    <hr>

    <h2>Available Study Hours Per Day</h2>

    <input
        type="number"
        step="0.5"
        name="study_hours"
        required>

    <br><br>

    <button type="submit">
        Generate Study Plan
    </button>

</form>

{% if results %}

<h2>Study Plan</h2>

<ol>
{% for subject in results %}
<li>
    {{ subject.name }}
    -
    Priority:
    {{ subject.priority }}
    -
    {{ subject.hours }}
    hours/day
</li>
{% endfor %}
</ol>

{% endif %}

</body>
</html>
